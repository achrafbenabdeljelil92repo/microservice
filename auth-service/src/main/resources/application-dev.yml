server:
  port: 8091

spring:
  application:
    name: AUTH-SERVICE
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: "http://localhost:8090/realms/master/protocol/openid-connect/certs"
  datasource:
    url: jdbc:mysql://localhost:3306/devis?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: root
    password: "password"
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: create
    show-sql: true

security:
  jwt:
    issuer: http://localhost:8090/realms/master
    audience: dept-app

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

keycloak:
  auth-server-url: http://localhost:8090
  realm: master
  resource: dept-app
  credentials:
    secret: PSKAzr4ttjDqDLfAdTl2gsvvN2ZAeQBV
  redirect-uri: http://localhost:8080/login
