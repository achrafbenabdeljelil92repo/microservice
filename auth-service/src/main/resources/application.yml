server:
  port: 8091

spring:
  application:
    name: AUTH-SERVICE

  kafka:
    bootstrap-servers: localhost:9092

    consumer:
      group-id: auth-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      properties:
        spring:
          json:
            trusted:
              packages: "*"

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  cloud:
    config:
      enabled: false
    discovery:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: "http://localhost:8090/realms/master/protocol/openid-connect/certs"
  datasource:
    url: jdbc:mysql://localhost:3306/devis?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: root
    password: "password"
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

security:
  jwt:
    issuer: http://localhost:8090/realms/master
    audience: dept-app

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

keycloak:
  auth-server-url: http://localhost:8090
  realm: master
  resource: dept-app
  credentials:
    secret: PSKAzr4ttjDqDLfAdTl2gsvvN2ZAeQBV
  redirect-uri: http://localhost:8080/login
