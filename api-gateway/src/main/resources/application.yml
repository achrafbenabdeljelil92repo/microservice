server:
  port: 8888
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: "http://host.docker.internal:8090/realms/master/protocol/openid-connect/certs"
  logging:
    level:
      org.springframework.cloud.gateway: DEBUG
      reactor.netty.http.client: DEBUG
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/auth-service/**
              filters:
                - StripPrefix=1
            - id: stock-service
              uri: lb://STOCK-SERVICE
              predicates:
                - Path=/stock-service/**    # <-- ajouté
              filters:
                - StripPrefix=1

    config:
      enabled: false
    discovery:
      enabled: true
eureka:
  client:
    service-url:
      default-zone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
